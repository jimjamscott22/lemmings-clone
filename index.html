<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lemmings Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet" />
  </head>
  <body class="min-h-screen bg-stone-950 text-stone-200 font-mono antialiased">
    <div class="mx-auto flex h-screen max-w-7xl flex-col gap-3 px-4 py-4">
      <!-- Top bar -->
      <header class="flex flex-wrap items-baseline justify-between gap-x-6 gap-y-1">
        <h1 class="font-pixel text-xl tracking-wide text-lime-300">Lemmings<span class="text-stone-500">.ts</span></h1>
        <div class="flex flex-wrap items-baseline gap-x-5 gap-y-1 text-xs text-stone-400">
          <span>Level: <span id="hud-level" class="text-stone-100">—</span></span>
          <span>Out <span id="hud-out" class="tabular-nums text-stone-100">0</span></span>
          <span>Saved <span id="hud-saved" class="tabular-nums text-lime-300">0</span>/<span id="hud-need" class="tabular-nums">0</span></span>
          <span>Lost <span id="hud-lost" class="tabular-nums text-red-400">0</span></span>
          <span id="hud-fast" class="hidden text-sky-300">FAST ×3</span>
          <span>Tile: <span id="hud-tile" class="text-stone-100">—</span></span>
          <span id="hud-paused" class="hidden text-amber-300">PAUSED</span>
          <span><span id="hud-fps" class="tabular-nums text-stone-100">0</span> fps</span>
        </div>
      </header>

      <!-- Game viewport: the canvas is integer-scaled to fit this box -->
      <main id="viewport" class="relative flex min-h-0 flex-1 items-center justify-center rounded-lg border border-stone-800 bg-black/40">
        <canvas id="game" class="pixelated block shadow-2xl shadow-black"></canvas>

        <!-- End-of-level result -->
        <div id="result" class="absolute inset-0 hidden items-center justify-center rounded-lg bg-black/70">
          <div class="rounded-xl border border-stone-700 bg-stone-900/95 px-10 py-7 text-center shadow-2xl">
            <h2 id="result-title" class="font-pixel text-2xl"></h2>
            <p id="result-detail" class="mt-2 text-sm text-stone-300"></p>
            <div class="mt-6 flex justify-center gap-3">
              <button id="result-retry" type="button" class="rounded border border-stone-600 bg-stone-800 px-4 py-1.5 font-pixel text-sm text-stone-100 hover:bg-stone-700">Retry <kbd class="kbd">R</kbd></button>
              <button id="result-next" type="button" class="rounded border border-lime-500 bg-lime-600/20 px-4 py-1.5 font-pixel text-sm text-lime-200 hover:bg-lime-600/40">Next level <kbd class="kbd">N</kbd></button>
            </div>
          </div>
        </div>
      </main>

      <!-- Legend + key hints -->
      <footer class="flex flex-wrap items-center justify-between gap-x-6 gap-y-2 text-xs text-stone-400">
        <div class="flex items-center gap-4">
          <div id="hud-tools" class="flex gap-2"></div>
          <div class="flex items-center gap-1.5 font-pixel text-stone-300" title="Release rate: hold − / + to change faster">
            Rate
            <button id="hud-rate-down" type="button" aria-label="Slower release" class="rounded border border-stone-700 bg-stone-900 px-2 py-0.5 hover:bg-stone-800">−</button>
            <span id="hud-rate" class="w-6 text-center tabular-nums text-stone-100">50</span>
            <button id="hud-rate-up" type="button" aria-label="Faster release" class="rounded border border-stone-700 bg-stone-900 px-2 py-0.5 hover:bg-stone-800">+</button>
          </div>
        </div>
        <ul id="hud-legend" class="flex flex-wrap gap-x-4 gap-y-1"></ul>
        <div class="flex gap-4">
          <span><kbd class="kbd">1</kbd><kbd class="kbd">2</kbd> tool · drag to use</span>
          <button id="hud-restart" type="button" class="hover:text-stone-200"><kbd class="kbd">R</kbd> restart</button>
          <span><kbd class="kbd">−</kbd><kbd class="kbd">+</kbd> rate</span>
          <span><kbd class="kbd">F</kbd> fast</span>
          <span><kbd class="kbd">G</kbd> grid</span>
          <span><kbd class="kbd">Space</kbd> pause</span>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
